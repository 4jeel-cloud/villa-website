<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Creek View Villa — A peaceful homestay in Padinjarathara, Wayanad. Book your stay online." />
    <meta name="theme-color" content="#1C3A28" />
    <title>Creek View Villa — Wayanad Homestay</title>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Preload hero image — loads before anything else -->
    <link rel="preload" as="image" href="/DSC01019.webp" />

    <!-- Tabler Icons (used in Amenities & Rooms pages) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css" />

    <!-- Font preconnect — eliminates DNS lookup delay -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://homestay-backend-nccp.onrender.com" />

    <!-- Fonts with display=swap — text visible immediately in fallback font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Pacifico&family=Oswald:wght@500;600&family=DM+Sans:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Razorpay only needed when payment is triggered — defer so it doesn't block render -->
    <script src="https://checkout.razorpay.com/v1/checkout.js" defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
